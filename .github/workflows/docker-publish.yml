name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image:
        description: "Image variant to publish"
        type: choice
        options:
          - standard
          - android-36
        default: standard

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image (amd64 & arm64)
        if: github.event_name == 'push' || inputs.image == 'standard'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            bentech/ionic-capacitor-docker:latest
            bentech/ionic-capacitor-docker:${{ github.run_number }}

      - name: Build and Push Android 36 Image (amd64)
        if: github.event_name == 'workflow_dispatch' && inputs.image == 'android-36'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.android36
          push: true
          platforms: linux/amd64
          tags: |
            bentech/ionic-capacitor-docker:android-36
            bentech/ionic-capacitor-docker:android-36-${{ github.run_number }}

      - name: Image Build Completed
        run: echo "Docker image successfully built and pushed!"
